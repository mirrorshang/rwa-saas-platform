name: Issuer V1 checks

on:
  pull_request:
    paths:
      - "apps/issuer/**"
      - ".github/workflows/issuer-v1.yml"
  push:
    branches:
      - "release/v1-engineering-handover-20261116"
    paths:
      - "apps/issuer/**"
      - ".github/workflows/issuer-v1.yml"

permissions:
  contents: read

jobs:
  issuer:
    name: Issuer tests, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/issuer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/issuer/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run automated tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Production build
        run: pnpm build
